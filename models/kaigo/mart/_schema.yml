version: 2

models:
  - name: establishment
    description: |
      全国の介護サービス事業所。介護保険の対象となる介護サービスを提供する事業所を
      1 事業所 1 レコードで収録し、所在地・緯度経度・法人番号・サービス種類・定員などを持つ。
      同一の法人・所在地でも提供するサービス種類ごとに別レコードになる。
      緯度経度は欠測（0.0）や日本国外の誤登録値を除外し、有効な値のみ保持する
      （無効・欠測は NULL）。
      出典: 介護サービス情報公表システム（厚生労働省）のデータを加工して作成。
      https://www.mhlw.go.jp/stf/kaigo-kouhyou_opendata.html
    access: public
    columns:
      - name: establishment_number
      - name: service_type
      - name: name
      - name: name_kana
      - name: local_gov_code
      - name: prefecture_code
      - name: city_code
      - name: prefecture
      - name: city
      - name: address
      - name: address_note
      - name: latitude
      - name: longitude
      - name: geometry
      - name: phone
      - name: fax
      - name: corporate_number
      - name: corporate_name
      - name: capacity
      - name: available_days
      - name: available_days_note
      - name: url
      - name: shared_with_disability
      - name: meets_ltci_standard
      - name: meets_disability_welfare_standard
      - name: note
