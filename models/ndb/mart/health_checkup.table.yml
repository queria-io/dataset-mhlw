schema: ndb
name: health_checkup
title: 特定健診 検査値分布
description: |-
  特定健診の検査値の分布を、検査項目 × 都道府県 × 検査値階層 × 性 × 年齢階級ごとの受診者数で持つ集計表です（NDB オープンデータ第 11 回、2023 年度）。

  - 集計結果が 10 未満のセルは秘匿されていて、count は NULL です
  - 検査値階層（value_class）の表現は検査項目ごとに異なります
keywords:
  - 特定健診
  - 健康診断
  - NDB
  - 医療
  - 厚生労働省
published: true
themes: [social_security_health]
sources:
  - path: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000177182.html
fields:
  - name: fiscal_year
    title: 年度
    description: 集計対象年度（西暦）
  - name: test_item
    title: 検査項目
    description: BMI・HbA1C・収縮期血圧・眼底検査（SCOTT分類）など、特定健診の検査項目
  - name: unit
    title: 単位
    description: 検査値階層の単位・注記（kg/㎡・mmHg・％※NGSP値 など）。分類項目は NULL
  - name: prefecture_code
    title: 都道府県コード
    description: 都道府県コード（2 桁）。都道府県判別不可は NULL
    semantic: { role: entity, name: prefecture }
  - name: prefecture
    title: 都道府県名
    description: 施設所在地の都道府県名。判別不可は「都道府県判別不可」
  - name: sex
    title: 性
    description: 男／女
  - name: age_class
    title: 年齢階級
    description: 40〜74 歳を 5 歳刻みで区分（特定健診の対象年齢）
  - name: value_class
    title: 検査値階層
    description: 検査値階層。数値範囲・分類・判定・所見など項目により異なる
  - name: count
    title: 人数
    description: 当該区分に該当する受診者数。集計結果 10 未満の秘匿セルは NULL
