schema: shougai
name: establishment
title: 障害福祉サービス等事業所
description: |-
  全国の障害福祉サービス等事業所の所在地・緯度経度・法人番号・サービス種類・定員です。

  - 1 行は事業所 × サービス種類です。事業所数は establishment_number の重複を除いて数えてください
  - 欠測や日本国外の誤登録の緯度経度は NULL です
keywords:
  - 障害福祉
  - 福祉
  - 事業所
  - GIS
  - 法人番号
published: true
themes: [social_security_health]
sources:
  - path: https://www.wam.go.jp/content/wamnet/pcpub/top/sfkopendata/
fields:
  - name: establishment_number
    title: 事業所番号
    description: 障害福祉サービス等事業所番号。サービス種類が異なると同一番号が複数行に現れる
  - name: service_type
    title: サービス種別
    description: 居宅介護・生活介護・就労継続支援B型・放課後等デイサービスなど、提供する障害福祉サービス等の種類
  - name: name
    title: 事業所名
  - name: name_kana
    title: 事業所名カナ
  - name: local_gov_code
    title: 地方公共団体コード
    description: 全国地方公共団体コード（5 桁・チェックデジットなし）
    semantic: { role: entity, name: city }
  - name: prefecture_code
    title: 都道府県コード
    description: 地方公共団体コードの上 2 桁
    semantic: { role: entity, name: prefecture }
  - name: city_code
    title: 市区町村コード
    description: 5 桁の全国地方公共団体コード。lg_code / address_br と結合可
    semantic: { role: entity, name: city }
  - name: designating_authority
    title: 指定機関名
    description: 事業所を指定した自治体（都道府県・政令市・中核市など）の名称
  - name: address_city
    title: 事業所住所（市区町村）
    description: 都道府県名から市区町村名までの住所
  - name: address_detail
    title: 事業所住所（番地以降）
  - name: latitude
    title: 緯度
    description: 十進度（世界測地系）。欠測・国外誤登録は NULL
  - name: longitude
    title: 経度
    description: 十進度（世界測地系）。欠測・国外誤登録は NULL
  - name: geometry
    title: ジオメトリ
    description: 緯度経度が有効な事業所の位置（POINT）
  - name: phone
    title: 事業所電話番号
  - name: fax
    title: 事業所FAX番号
  - name: url
    title: 事業所URL
  - name: corporate_number
    title: 法人番号
    description: 13 桁の法人番号。houjin_bangou と結合可。未登録は NULL
    semantic: { role: entity, name: corporate_number }
  - name: corporate_name
    title: 法人の名称
  - name: corporate_name_kana
    title: 法人の名称カナ
  - name: corporate_address_city
    title: 法人住所（市区町村）
  - name: corporate_address_detail
    title: 法人住所（番地以降）
  - name: capacity
    title: 定員
    description: 事業所の定員。定員概念のないサービス（訪問系・相談支援など）は NULL
  - name: hours_weekday
    title: 利用可能な時間帯（平日）
  - name: hours_saturday
    title: 利用可能な時間帯（土曜）
  - name: hours_sunday
    title: 利用可能な時間帯（日曜）
  - name: hours_holiday
    title: 利用可能な時間帯（祝日）
  - name: closed_days
    title: 定休日
  - name: available_days_note
    title: 利用可能曜日特記事項
  - name: system_no
    title: システム番号
    description: 障害福祉サービス等情報公表システム内の固有番号（連番）
