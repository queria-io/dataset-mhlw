schema: shougai
name: establishment
title: 障害福祉サービス等事業所
description: '全国の障害福祉サービス等事業所。障害者総合支援法・児童福祉法に基づく障害福祉

  サービス等を提供する事業所を 1 事業所 1 レコードで収録し、所在地・緯度経度・

  法人番号・サービス種類・定員などを持つ。

  同一の法人・所在地でも提供するサービス種類ごとに別レコードになる。

  緯度経度は欠測（0.0）や日本国外の誤登録値を除外し、有効な値のみ保持する

  （無効・欠測は NULL）。

  出典: 障害福祉サービス等情報公表システム（厚生労働省、WAM NET 配信）のデータを

  加工して作成。

  https://www.wam.go.jp/content/wamnet/pcpub/top/sfkopendata/'
keywords:
  - 障害福祉
  - 福祉
  - 事業所
  - GIS
  - 法人番号
published: true
sources:
  - path: https://www.wam.go.jp/content/wamnet/pcpub/top/sfkopendata/
fields:
  - name: establishment_number
    title: 事業所番号
    description: 障害福祉サービス等事業所番号。サービス種類が異なると同一番号が複数行に現れる
  - name: service_type
    title: サービス種別
    description: 居宅介護・生活介護・就労継続支援B型・放課後等デイサービスなど、提供する障害福祉サービス等の種類
  - name: name
    title: 事業所名
  - name: name_kana
    title: 事業所名カナ
  - name: local_gov_code
    title: 地方公共団体コード
    description: 全国地方公共団体コード（5 桁・チェックデジットなし）
  - name: prefecture_code
    title: 都道府県コード
    description: 地方公共団体コードの上 2 桁
  - name: city_code
    title: 市区町村コード
    description: 5 桁の全国地方公共団体コード。lg_code / address_br と結合可
  - name: designating_authority
    title: 指定機関名
    description: 事業所を指定した自治体（都道府県・政令市・中核市など）の名称
  - name: address_city
    title: 事業所住所（市区町村）
    description: 都道府県名から市区町村名までの住所
  - name: address_detail
    title: 事業所住所（番地以降）
  - name: latitude
    title: 緯度
    description: 十進度（世界測地系）。欠測・国外誤登録は NULL
  - name: longitude
    title: 経度
    description: 十進度（世界測地系）。欠測・国外誤登録は NULL
  - name: geometry
    title: ジオメトリ
    description: 緯度経度が有効な事業所の位置（POINT）
  - name: phone
    title: 事業所電話番号
  - name: fax
    title: 事業所FAX番号
  - name: url
    title: 事業所URL
  - name: corporate_number
    title: 法人番号
    description: 13 桁の法人番号。houjin_bangou と結合可。未登録は NULL
  - name: corporate_name
    title: 法人の名称
  - name: corporate_name_kana
    title: 法人の名称カナ
  - name: corporate_address_city
    title: 法人住所（市区町村）
  - name: corporate_address_detail
    title: 法人住所（番地以降）
  - name: capacity
    title: 定員
    description: 事業所の定員。定員概念のないサービス（訪問系・相談支援など）は NULL
  - name: hours_weekday
    title: 利用可能な時間帯（平日）
  - name: hours_saturday
    title: 利用可能な時間帯（土曜）
  - name: hours_sunday
    title: 利用可能な時間帯（日曜）
  - name: hours_holiday
    title: 利用可能な時間帯（祝日）
  - name: closed_days
    title: 定休日
  - name: available_days_note
    title: 利用可能曜日特記事項
  - name: system_no
    title: システム番号
    description: 障害福祉サービス等情報公表システム内の固有番号（連番）
