version: 2

models:
  - name: josei_company
    description: |
      女性の活躍推進企業データベースに企業が公表した、女性活躍・両立支援の主要指標。
      女性活躍推進法・次世代育成支援対策推進法に基づく情報公表制度で、企業が任意に
      公表した指標を 1 企業 1 レコードで収録する。管理職・役員に占める女性割合、
      男女の賃金の差異、育児休業取得率、平均残業時間、有給休暇取得率、えるぼし・
      くるみん認定などを持つ。
      指標は企業の任意公表のため、開示していない企業は当該列が NULL になる。
      育児休業取得率は雇用管理区分ごとに公表されるが、本テーブルでは先頭区分
      （childcare_leave_category）の代表値のみを収録する。
      法人番号で houjin_bangou / gbizinfo と結合でき、ESG・人的資本分析に利用できる。
      元データは 236 列に及ぶ横持ちのため、企業単位で単一値となる主要指標に絞っている。
      出典: 女性の活躍推進企業データベース（厚生労働省）のオープンデータを加工して作成。
      https://positive-ryouritsu.mhlw.go.jp/positivedb/opendata/
    access: public
    columns:
      - name: corporate_number
      - name: company_name
      - name: industry
      - name: industry_detail
      - name: prefecture
      - name: company_size
      - name: market_segment
      - name: securities_code
      - name: eruboshi_stage
      - name: kurumin
      - name: women_in_kakaricho_pct
      - name: women_in_management_pct
      - name: women_on_board_pct
      - name: gender_wage_gap_all_pct
      - name: gender_wage_gap_regular_pct
      - name: gender_wage_gap_nonregular_pct
      - name: wage_gap_period
      - name: childcare_leave_category
      - name: childcare_leave_male_pct
      - name: childcare_leave_female_pct
      - name: avg_monthly_overtime_hours
      - name: paid_leave_rate_pct
      - name: last_updated
