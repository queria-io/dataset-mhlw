version: 2

models:
  - name: iryo_joho_net_facility
    access: public
    columns:
      - name: id
      - name: facility_type
      - name: name
      - name: name_kana
      - name: short_name
      - name: short_name_kana
      - name: name_en
      - name: prefecture_code
      - name: city_code
      - name: local_gov_code
      - name: address
      - name: latitude
      - name: longitude
      - name: geometry
      - name: url
      - name: general_beds
      - name: long_term_care_beds
      - name: long_term_care_medical_insurance_beds
      - name: long_term_care_ltci_beds
      - name: psychiatric_beds
      - name: tuberculosis_beds
      - name: infectious_beds
      - name: total_beds
      - name: as_of
  - name: iryo_joho_net_speciality
    access: public
    columns:
      - name: id
      - name: speciality_code
      - name: speciality_name
      - name: as_of
