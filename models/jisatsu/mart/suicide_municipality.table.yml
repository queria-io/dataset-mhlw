schema: jisatsu
name: suicide_municipality
title: 市区町村別の自殺者数
description: |-
  市区町村別・年別の自殺者数。厚生労働省「地域における自殺の基礎資料」の確定値
  （警察庁の自殺統計を厚生労働省が市区町村別に再集計したもの）のうち、年計の
  自殺日集計を収録する。2022 年から 2025 年。
  住居地（自殺者の住居があった市区町村）と発見地（自殺死体が発見された市区町村）の
  2 通りの集計を location_basis で持つ。
  1 行 = 年 × 集計地 × 市区町村 × 性 × 属性区分 × 区分 の自殺者数。属性区分は
  年齢階級、同居人の有無、職業、場所、手段、時間帯、曜日、原因・動機、自殺未遂歴。
  自殺者が 0 人の市区町村は行が無い。
  政令指定都市と東京都特別区は、市の行（area_level = 市区町村）と各区の行（area_level = 区）の
  両方を持つ。市の行は各区の和で、区が分からない人数（area_level = 区不詳）を含まない。
  市の総数には同じ市の区不詳の行を足す。全国や都道府県の合計を出すときは
  area_level = 区 の行を除いて足す。
  個人が識別されないよう秘匿処理がある。自殺者総数が 1 か 2 の自治体では職業、場所、
  手段、原因・動機、自殺未遂歴が公表されず、それ以外でも他の欄から 1 か 2 が逆算できる
  欄は公表されない。秘匿された欄の人数は NULL。
  原因・動機は 1 人につき 4 つまで計上するため、区分の和は総数と一致しない。
  自殺死亡率は収録しない。小さい自治体は年に数人のため、率にすると年ごとの変動が大きい。
  2022 年 1 月から自殺統計原票が見直され、職業と原因・動機の区分が変わったため、
  それより前の年は収録していない。
  出典: 地域における自殺の基礎資料（厚生労働省）のデータを加工して作成。
  https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000140901.html
keywords:
  - 自殺
  - 自殺対策
  - 自殺統計
  - 市区町村
  - 厚生労働省
published: true
sources:
  - path: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000140901.html
fields:
  - name: year
    title: 年
    description: 集計対象の年（西暦・暦年）。自殺日で集計
  - name: location_basis
    title: 集計地
    description: 住居地（自殺者の住居があった市区町村）／発見地（自殺死体が発見された市区町村）
  - name: prefecture_code
    title: 都道府県コード
    description: 全国地方公共団体コードの上 2 桁。area_level が都道府県不詳の行は NULL
  - name: local_gov_code
    title: 地方公共団体コード
    description: 全国地方公共団体コード（6 桁 = 5 桁自治体コード + チェックデジット）。area_level が市区町村・区の行だけが持つ
  - name: city_code
    title: 市区町村コード
    description: 地方公共団体コードの上 5 桁。lg_code / address_br と結合できる
  - name: municipality
    title: 市区町村名
    description: 都道府県名を付けた市区町村名（例 北海道函館市）。政令指定都市の区は市名から（例 札幌市中央区）、東京都の特別区は都名から（例 東京都千代田区）。特別区全体の行は東京都特別区
  - name: area_level
    title: 行の種別
    description: 市区町村（通常の市町村と、政令指定都市・東京都特別区の各区の和）／区（政令指定都市の区と東京都の特別区）／区不詳（政令指定都市内で区が分からないもの）／市区町村不詳／都道府県不詳
  - name: sex
    title: 性
    description: 総数／男／女
  - name: attribute
    title: 属性区分
    description: 総数、年齢階級、同居人の有無、職業、場所、手段、時間帯、曜日、原因・動機、自殺未遂歴
  - name: category
    title: 区分
    description: 属性区分の中の区分（年齢階級なら 20-29歳 など）。attribute が総数の行は総数
  - name: parent_category
    title: 上位の区分
    description: 内数の区分が属する上位の区分。職業の学生・生徒等と無職者は無職の、主婦・主夫など 4 区分は無職者の内数。上位の区分が無い区分は NULL
  - name: count
    title: 自殺者数
    description: 当該区分の自殺者数（人）。秘匿された欄は NULL
