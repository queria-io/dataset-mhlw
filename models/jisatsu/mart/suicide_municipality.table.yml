schema: jisatsu
name: suicide_municipality
title: 市区町村別の自殺者数
description: |-
  市区町村別・年別の自殺者数を、住居地と発見地の集計、性、属性区分（年齢階級・職業・手段など）ごとに持ちます（2022〜2025 年）。

  - 政令指定都市と特別区は市の行と区の行の両方を持ちます。合計は area_level = '区' を除いて足してください
  - 秘匿された欄の count は NULL で、0 ではありません
  - 原因・動機は 1 人につき 4 つまで計上するため、区分の和は総数と一致しません
keywords:
  - 自殺
  - 自殺対策
  - 自殺統計
  - 市区町村
  - 厚生労働省
sources:
  - path: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000140901.html
fields:
  - name: year
    title: 年
    description: 集計対象の年（西暦・暦年）。自殺日で集計
  - name: location_basis
    title: 集計地
    description: 住居地（自殺者の住居があった市区町村）／発見地（自殺死体が発見された市区町村）
  - name: prefecture_code
    title: 都道府県コード
    description: 全国地方公共団体コードの上 2 桁。area_level が都道府県不詳の行は NULL
    annotations: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: local_gov_code
    title: 地方公共団体コード
    description: 全国地方公共団体コード（6 桁）。市区町村と区の行だけが持つ
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: city_code
    title: 市区町村コード
    description: 地方公共団体コードの上 5 桁。lg_code / address_br と結合できる
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: municipality
    title: 市区町村名
    description: 都道府県名を付けた市区町村名（例 北海道函館市、札幌市中央区）
  - name: area_level
    title: 行の種別
    description: 行の種別。市区町村／区／区不詳／市区町村不詳／都道府県不詳
  - name: sex
    title: 性
    description: 総数／男／女
  - name: attribute
    title: 属性区分
    description: 総数、年齢階級、同居人の有無、職業、場所、手段、時間帯、曜日、原因・動機、自殺未遂歴
  - name: category
    title: 区分
    description: 属性区分の中の区分（年齢階級なら 20-29歳 など）。attribute が総数の行は総数
  - name: parent_category
    title: 上位の区分
    description: 内数の区分が属する上位の区分（職業のみ）。無ければ NULL
  - name: count
    title: 自殺者数
    description: 当該区分の自殺者数（人）。秘匿された欄は NULL
annotations:
  queria:
    themes: [social_security_health]
