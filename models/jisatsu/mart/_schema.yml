version: 2

models:
  - name: suicide_municipality
    description: |
      市区町村別・年別の自殺者数。厚生労働省「地域における自殺の基礎資料」の確定値
      （警察庁の自殺統計を厚生労働省が市区町村別に再集計したもの）のうち、年計の
      自殺日集計を収録する。2022 年から 2025 年。
      住居地（自殺者の住居があった市区町村）と発見地（自殺死体が発見された市区町村）の
      2 通りの集計を location_basis で持つ。
      1 行 = 年 × 集計地 × 市区町村 × 性 × 属性区分 × 区分 の自殺者数。属性区分は
      年齢階級、同居人の有無、職業、場所、手段、時間帯、曜日、原因・動機、自殺未遂歴。
      自殺者が 0 人の市区町村は行が無い。
      政令指定都市と東京都特別区は、市の行（area_level = 市区町村）と各区の行（area_level = 区）の
      両方を持つ。市の行は各区の和で、区が分からない人数（area_level = 区不詳）を含まない。
      市の総数には同じ市の区不詳の行を足す。全国や都道府県の合計を出すときは
      area_level = 区 の行を除いて足す。
      個人が識別されないよう秘匿処理がある。自殺者総数が 1 か 2 の自治体では職業、場所、
      手段、原因・動機、自殺未遂歴が公表されず、それ以外でも他の欄から 1 か 2 が逆算できる
      欄は公表されない。秘匿された欄の人数は NULL。
      原因・動機は 1 人につき 4 つまで計上するため、区分の和は総数と一致しない。
      自殺死亡率は収録しない。小さい自治体は年に数人のため、率にすると年ごとの変動が大きい。
      2022 年 1 月から自殺統計原票が見直され、職業と原因・動機の区分が変わったため、
      それより前の年は収録していない。
      出典: 地域における自殺の基礎資料（厚生労働省）のデータを加工して作成。
      https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000140901.html
    access: public
    columns:
      - name: year
      - name: location_basis
      - name: prefecture_code
      - name: local_gov_code
      - name: city_code
      - name: municipality
      - name: area_level
      - name: sex
      - name: attribute
      - name: category
      - name: parent_category
      - name: count
