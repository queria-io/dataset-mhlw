name: Sync

# josei の取得元が日本国外からのアクセスを 403 で弾くため、GitHub ホストランナー（US）
# ではビルドが通らない。公開は日本国内から scripts/sync-local.sh で行う（MAINTAINING.md）。
# 自動トリガーは持たせず、手動実行だけ残す。地域制限が解除されたら push / schedule を戻す。
on:
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@f105231505e29dd4b833cb333eedfb5f22e2a959
    with:
      dataset_name: mhlw
    secrets:
      QUERIA_TOKEN: ${{ secrets.QUERIA_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
