name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  schedule:
    # 地域における自殺の基礎資料は毎月 1 か月分ずつ追加される。毎月 25 日 04:00 JST に取る
    # josei の取得元は日本国外を 403 で弾くので、Actions では前回の値を引き継ぐ (MAINTAINING.md)
    - cron: "0 19 24 * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: mhlw
      # 日本国内の実行で取得と dbt に約 55 分かかった
      timeout_minutes: 120
    secrets: inherit
