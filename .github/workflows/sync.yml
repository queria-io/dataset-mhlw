name: Sync

# josei の取得元が日本国外からのアクセスを 403 で弾くため、GitHub ホストランナー（US）
# ではビルドが通らない。公開は日本国内から scripts/sync-local.sh で行う（README「ビルド」）。
# 自動トリガーは持たせず、手動実行だけ残す。地域制限が解除されたら push / schedule を戻す。
on:
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: mhlw
    secrets: inherit
