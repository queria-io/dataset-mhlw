name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  schedule:
    - cron: "0 19 1 7 *" # 毎年7月2日 04:00 JST（介護データは年2回更新のため年次）
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: mhlw
      s3_bucket: ${{ vars.S3_BUCKET }}
    secrets: inherit
