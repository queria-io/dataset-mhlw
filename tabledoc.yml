name: mhlw
title: 厚生労働省
description: |-
  厚生労働省が公開する、全国の保険医療機関・保険薬局（医療機関コード）と医療機関・薬局の所在地、介護・障害福祉サービス事業所、特定健診の検査値の分布（NDB）、市区町村別の自殺者数、DPC 調査に参加した病院の MDC 別の退院患者数、ハローワーク（公共職業安定所）の所在地と管轄区域です。行政事業レビューのシートが関係する計画・通知等として挙げる厚生労働省のサイトの PDF も、ページごとの本文を持ちます。事業所と医療情報ネットの施設は市区町村コードで他のデータセットと結合できます。

  出典：厚生労働省（地方厚生局「コード内容別医療機関一覧表」、医療情報ネット オープンデータ、介護サービス情報公表システム、障害福祉サービス等情報公表システム、NDB オープンデータ、地域における自殺の基礎資料、DPC 導入の影響評価に係る調査「退院患者調査」、都道府県労働局所在地一覧）を加工して作成。
