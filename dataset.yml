  - name: josei_katsuyaku
    title: 女性活躍推進企業
  - name: jisatsu
    title: 自殺統計（市区町村別）
  - name: dpc
    title: DPC 退院患者調査
  - name: kouseikyoku
    title: 保険医療機関・保険薬局（地方厚生局）
