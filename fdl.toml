name = "mhlw"
command = "python main.py"

[targets.default]
url = "s3://${FDL_S3_BUCKET}"
public_url = "https://data.queria.io"
s3_endpoint = "${FDL_S3_ENDPOINT}"
s3_access_key_id = "${FDL_S3_ACCESS_KEY_ID}"
s3_secret_access_key = "${FDL_S3_SECRET_ACCESS_KEY}"

[targets.local]
url = "~/.local/share/fdl"
public_url = "http://localhost:4001"

[meta]
license = "公共データ利用規約（第1.0版）(PDL1.0) / CC BY 4.0"
license_url = "https://www.mhlw.go.jp/chosakuken/index.html"
title = "厚生労働省"
description = """厚生労働省が公開するオープンデータ。
介護サービス情報公表システムから抽出した全国の介護サービス事業所情報（kaigo）と、
障害福祉サービス等情報公表システムから抽出した全国の障害福祉サービス等事業所情報
（shougai）を収録する。いずれも所在地・緯度経度・法人番号・サービス種類・定員などを持つ。
あわせて NDB オープンデータの特定健診 検査値の都道府県別・性年齢階級別分布（ndb）を収録する。"""
cover = "🏥"
tags = ['介護', '障害福祉', '福祉', '事業所', 'GIS', '法人番号', '特定健診', '健康診断', 'NDB', '厚生労働省']
source_url = "https://www.mhlw.go.jp/stf/kaigo-kouhyou_opendata.html"
repository_url = "https://github.com/queria-io/dataset-mhlw"
schedule = "yearly"

[meta.schemas]
kaigo.title = "介護サービス"
shougai.title = "障害福祉サービス"
ndb.title = "特定健診（NDB）"
